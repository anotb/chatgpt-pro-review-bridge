name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: release preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Node dependencies
        run: npm --prefix packages/node ci
      - name: Install Python release tools
        run: python -m pip install --upgrade build twine
      - run: npm run release:check-version
      - run: npm run release:check-names
      - run: npm run node:test
      - run: npm run node:build
      - run: npm run node:bundle
      - run: npm run node:contracts
      - run: npm run python:test
      - run: npm run python:compile
      - run: npm run python:pyright
      - run: npm run python:ordinary-shell
      - run: npm run plugin:validate
      - run: npm run plugin:check
      - run: npm run release:check-node-pack
      - name: Build and check Python distributions
        run: |
          rm -rf packages/python/.venv dist/python
          npm run release:build-python
          npm run release:check-python
      - name: Assemble GitHub release assets
        run: |
          mkdir -p dist/node
          npm pack ./packages/node --pack-destination dist/node
          cd dist
          sha256sum node/*.tgz python/* > "SHA256SUMS-${GITHUB_REF_NAME#v}.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ github.ref_name }}
          path: |
            dist/node/*.tgz
            dist/python/*
            dist/SHA256SUMS-*.txt
          if-no-files-found: error

  package-smoke-macos:
    name: release package smoke (macos-latest)
    needs: preflight
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/node/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: npm --prefix packages/node ci
      - run: python -m pip install --upgrade build
      - run: npm run node:build
      - run: npm run node:bundle
      - run: npm run release:check-node-pack
      - run: npm run release:smoke-source

  publish-npm:
    name: publish npm
    if: github.repository == 'anotb/chatgpt-pro-review-bridge' && vars.PUBLISH_NPM == 'true'
    needs: [preflight, package-smoke-macos]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm --prefix packages/node ci
      - run: npm run release:check-version
      - run: npm run node:build
      - run: npm run node:bundle
      - run: npm run release:check-node-pack
      - name: Publish Node package to npm
        working-directory: packages/node
        run: npm publish --provenance --access public --tag latest

  verify-published:
    name: verify published npm install
    if: github.repository == 'anotb/chatgpt-pro-review-bridge' && vars.PUBLISH_NPM == 'true'
    needs: publish-npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm run release:verify-published

  github-release:
    name: publish stable GitHub release
    if: github.repository == 'anotb/chatgpt-pro-review-bridge'
    needs: [preflight, package-smoke-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-assets-${{ github.ref_name }}
          path: dist
      - name: Publish the verified stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          --repo "${GITHUB_REPOSITORY}"
          --verify-tag
          --generate-notes
          --title "ChatGPT Pro Review Bridge ${GITHUB_REF_NAME#v}"
          dist/node/*.tgz
          dist/python/*
          dist/SHA256SUMS-*.txt
