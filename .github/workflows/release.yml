name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Verify and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/node/package-lock.json
      - run: npm --prefix packages/node ci
      - name: Verify tag and package versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";

          const readJson = async path => JSON.parse(await readFile(path, "utf8"));
          const expected = process.env.RELEASE_TAG?.replace(/^v/, "");
          const versions = {
            repository: (await readJson("package.json")).version,
            package: (await readJson("packages/node/package.json")).version,
            plugin: (await readJson("plugins/chatgpt-bridge/.codex-plugin/plugin.json")).version.split("+")[0]
          };
          for (const [name, version] of Object.entries(versions)) {
            if (version !== expected) {
              throw new Error(`${name} version ${version} does not match tag ${process.env.RELEASE_TAG}`);
            }
          }
          NODE
      - run: npm test
      - run: npm run build
      - run: npm run bundle
      - run: npm run plugin:check
      - run: npm run plugin:validate
      - run: npm run pack:check
      - name: Assemble release assets
        run: |
          mkdir -p dist
          npm pack ./packages/node --pack-destination dist
          sha256sum dist/*.tgz > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: chatgpt-bridge-${{ github.ref_name }}
          path: |
            dist/*.tgz
            dist/SHA256SUMS.txt
          if-no-files-found: error

  publish_npm:
    name: Publish npm package
    if: github.repository == 'anotb/chatgpt-bridge' && vars.PUBLISH_NPM == 'true'
    needs: package
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: chatgpt-bridge-${{ github.ref_name }}
          path: dist
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Publish once
        run: |
          version="${GITHUB_REF_NAME#v}"
          if npm view "chatgpt-pro-review-bridge@$version" version >/dev/null 2>&1; then
            echo "chatgpt-pro-review-bridge@$version is already published"
          else
            npm publish ./dist/*.tgz --provenance --access public --tag latest
          fi

  release_gate:
    name: Verify release path
    if: always() && github.repository == 'anotb/chatgpt-bridge'
    needs: [package, publish_npm]
    runs-on: ubuntu-latest
    steps:
      - name: Require every enabled stage
        env:
          PUBLISH_NPM: ${{ vars.PUBLISH_NPM }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          PUBLISH_RESULT: ${{ needs.publish_npm.result }}
        run: |
          test "$PACKAGE_RESULT" = success
          if [ "$PUBLISH_NPM" = true ]; then
            test "$PUBLISH_RESULT" = success
          else
            test "$PUBLISH_RESULT" = skipped
          fi

  github_release:
    name: Publish GitHub release
    needs: release_gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: chatgpt-bridge-${{ github.ref_name }}
          path: dist
      - name: Create verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          --repo "${GITHUB_REPOSITORY}"
          --verify-tag
          --notes-file "docs/releases/${GITHUB_REF_NAME#v}.md"
          --title "ChatGPT Bridge ${GITHUB_REF_NAME#v}"
          dist/*.tgz
          dist/SHA256SUMS.txt
